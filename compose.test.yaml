# Separate project, network, and fresh named volume. Never attach the existing instance's storage.
name: how-much-ai-sub2api-test
services:
  dashboard:
    build: .
    ports:
      - "127.0.0.1:3301:3000"
      - "100.126.0.101:3301:3000"
    environment:
      APP_URL: http://mt-gpu2.bunny-viper.ts.net:3301
      APP_EXTRA_ORIGINS: https://hma.shulynn.com
      VAULT_DATA_DIR: /app/.data
      # Same-machine shortcut: reads the host's Claude Code login mounted below. Only for a
      # single-user, tailnet-only instance.
      ENABLE_LOCAL_CONNECT: "1"
      HOME: /home/node
    # Match the host user so the 0600 credential file is readable; chown the vault volume once:
    #   docker run --rm -v how-much-ai-sub2api-test_test-vault:/d alpine chown -R 1008:100 /d
    user: "1008:100"
    volumes:
      - test-vault:/app/.data
      - /home/wogong/.claude/.credentials.json:/home/node/.claude/.credentials.json:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
volumes:
  test-vault:
