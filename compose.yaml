# General-purpose deployment. Runtime configuration lives in .env.docker (gitignored, optional);
# host-specific tweaks (bind address, extra mounts, user) go in compose.override.yaml.
# Start:  docker compose up -d --build
name: how-much-ai
services:
  app:
    build: .
    image: how-much-ai
    ports:
      - "${HMA_BIND:-127.0.0.1}:${HMA_PORT:-3000}:3000"
    env_file:
      - path: .env.docker
        required: false
    environment:
      VAULT_DATA_DIR: /app/.data
    volumes:
      - vault:/app/.data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
volumes:
  vault:
